<text x="230" y="759" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#173b32" text-anchor="middle" dominant-baseline="central">User pays the owner</text>
<text x="230" y="797" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#173b32" text-anchor="middle" dominant-baseline="central">Owner verifies in the app</text>
