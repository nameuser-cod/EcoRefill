<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
<title id="title">EcoRefill system architecture</title>
<desc id="desc">Users access the mobile or web app and interact with the reverse vending machine. The app uses Firebase Authentication and Cloud Firestore. The Raspberry Pi runs AI, hardware control and backend services, and synchronizes records with Firestore. GCash payments are manually verified by the owner through the app.</desc>
<rect width="1600" height="1050" fill="white"/>
<text x="80" y="65" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700" fill="#173b32" text-anchor="start" dominant-baseline="central">EcoRefill</text>
<text x="80" y="111" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#51665e" text-anchor="start" dominant-baseline="central">SYSTEM ARCHITECTURE</text>
<rect x="1050" y="235" width="470" height="615" rx="24" fill="#f3f8f5" stroke="#b6ccc0" stroke-width="2"/>
<text x="1285" y="273" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#173b32" text-anchor="middle" dominant-baseline="central">REVERSE VENDING MACHINE</text>
<rect x="80" y="325" width="300" height="210" rx="16" fill="#f7f9f8" stroke="#75877f" stroke-width="2"/>
<text x="230" y="370" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#173b32" text-anchor="middle" dominant-baseline="central">Users</text>
<text x="230" y="426" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#173b32" text-anchor="middle" dominant-baseline="central">User / recycler</text>
<text x="230" y="464" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#173b32" text-anchor="middle" dominant-baseline="central">Device owner</text>
<rect x="520" y="325" width="370" height="210" rx="16" fill="#f3f8f5" stroke="#23765b" stroke-width="2"/>
<text x="705" y="370" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#173b32" text-anchor="middle" dominant-baseline="central">Mobile / Web App</text>
<text x="705" y="421" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#173b32" text-anchor="middle" dominant-baseline="central">Rewards, refills &amp; history</text>
<text x="705" y="459" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#173b32" text-anchor="middle" dominant-baseline="central">Owner approvals &amp; monitoring</text>
<rect x="1090" y="325" width="390" height="210" rx="16" fill="#ffffff" stroke="#75877f" stroke-width="2"/>
<text x="1285" y="370" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#173b32" text-anchor="middle" dominant-baseline="central">Machine Hardware</text>
<text x="1285" y="415" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#173b32" text-anchor="middle" dominant-baseline="central">Camera, scale, buttons &amp; sensors</text>
<text x="1285" y="453" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#173b32" text-anchor="middle" dominant-baseline="central">Screen / QR, pump &amp; sorting bins</text>
<rect x="1090" y="650" width="390" height="155" rx="16" fill="#ffffff" stroke="#23765b" stroke-width="2"/>
<text x="1285" y="690" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#173b32" text-anchor="middle" dominant-baseline="central">Raspberry Pi</text>
<text x="1285" y="735" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#173b32" text-anchor="middle" dominant-baseline="central">AI + hardware control</text>
<text x="1285" y="771" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#173b32" text-anchor="middle" dominant-baseline="central">Backend: rewards &amp; refill processing</text>
