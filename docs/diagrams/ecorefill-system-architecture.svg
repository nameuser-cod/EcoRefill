<text x="705" y="733" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#173b32" text-anchor="middle" dominant-baseline="central">Authentication · sign-in</text>
<text x="705" y="774" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#173b32" text-anchor="middle" dominant-baseline="central">Cloud Firestore · records</text>
