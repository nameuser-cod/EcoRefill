<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
<title id="title">EcoRefill system architecture</title>
<desc id="desc">Users access the mobile or web app and interact with the reverse vending machine. The app uses Firebase Authentication and Cloud Firestore. The Raspberry Pi runs AI, hardware control and backend services, and synchronizes records with Firestore. GCash payments are manually verified by the owner through the app.</desc>
