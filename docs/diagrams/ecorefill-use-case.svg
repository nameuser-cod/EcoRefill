<text x="1110" y="723.5" text-anchor="middle" dominant-baseline="middle" font-size="19" font-weight="normal" style="fill:#183D32">View scan photos and</text>
<text x="1110" y="748.5" text-anchor="middle" dominant-baseline="middle" font-size="19" font-weight="normal" style="fill:#183D32">rejection details</text>
