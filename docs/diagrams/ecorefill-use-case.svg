<text x="1110" y="650.5" text-anchor="middle" dominant-baseline="middle" font-size="19" font-weight="normal" style="fill:#183D32">recycling statistics</text>
<ellipse cx="490" cy="736" rx="197.5" ry="36.0" fill="#EAF7F1" stroke="#247558" stroke-width="2"/>
