<text x="490" y="834.0" text-anchor="middle" dominant-baseline="middle" font-size="19" font-weight="normal" style="fill:#183D32">Claim recycling reward by QR</text>
<ellipse cx="1110" cy="834" rx="197.5" ry="36.0" fill="#EAF7F1" stroke="#247558" stroke-width="2"/>
<text x="1110" y="834.0" text-anchor="middle" dominant-baseline="middle" font-size="19" font-weight="normal" style="fill:#183D32">View machine alerts</text>
<ellipse cx="490" cy="932" rx="197.5" ry="36.0" fill="#EAF7F1" stroke="#247558" stroke-width="2"/>
<text x="490" y="932.0" text-anchor="middle" dominant-baseline="middle" font-size="19" font-weight="normal" style="fill:#183D32">Request water refill by QR</text>
<ellipse cx="1110" cy="932" rx="197.5" ry="36.0" fill="#EAF7F1" stroke="#247558" stroke-width="2"/>
<text x="1110" y="919.5" text-anchor="middle" dominant-baseline="middle" font-size="19" font-weight="normal" style="fill:#183D32">Approve or reject</text>
<text x="1110" y="944.5" text-anchor="middle" dominant-baseline="middle" font-size="19" font-weight="normal" style="fill:#183D32">point purchases</text>
<ellipse cx="490" cy="1030" rx="197.5" ry="36.0" fill="#EAF7F1" stroke="#247558" stroke-width="2"/>
<text x="490" y="1030.0" text-anchor="middle" dominant-baseline="middle" font-size="19" font-weight="normal" style="fill:#183D32">Buy EcoPoints via GCash</text>
<ellipse cx="1110" cy="1030" rx="197.5" ry="36.0" fill="#EAF7F1" stroke="#247558" stroke-width="2"/>
<text x="1110" y="1017.5" text-anchor="middle" dominant-baseline="middle" font-size="19" font-weight="normal" style="fill:#183D32">Configure GCash</text>
<text x="1110" y="1042.5" text-anchor="middle" dominant-baseline="middle" font-size="19" font-weight="normal" style="fill:#183D32">receiving account</text>
<ellipse cx="490" cy="1128" rx="197.5" ry="36.0" fill="#EAF7F1" stroke="#247558" stroke-width="2"/>
<text x="490" y="1128.0" text-anchor="middle" dominant-baseline="middle" font-size="19" font-weight="normal" style="fill:#183D32">Check purchase status</text>
<ellipse cx="1110" cy="1128" rx="197.5" ry="36.0" fill="#EAF7F1" stroke="#247558" stroke-width="2"/>
<text x="1110" y="1115.5" text-anchor="middle" dominant-baseline="middle" font-size="19" font-weight="normal" style="fill:#183D32">Update machine details</text>
<text x="1110" y="1140.5" text-anchor="middle" dominant-baseline="middle" font-size="19" font-weight="normal" style="fill:#183D32">and location</text>
<ellipse cx="490" cy="1226" rx="197.5" ry="36.0" fill="#EAF7F1" stroke="#247558" stroke-width="2"/>
<text x="490" y="1226.0" text-anchor="middle" dominant-baseline="middle" font-size="19" font-weight="normal" style="fill:#183D32">View own transaction history</text>
<ellipse cx="1110" cy="1226" rx="197.5" ry="36.0" fill="#EAF7F1" stroke="#247558" stroke-width="2"/>
<text x="1110" y="1213.5" text-anchor="middle" dominant-baseline="middle" font-size="19" font-weight="normal" style="fill:#183D32">View machine transactions</text>
<text x="1110" y="1238.5" text-anchor="middle" dominant-baseline="middle" font-size="19" font-weight="normal" style="fill:#183D32">and owner points</text>
<g fill="none" stroke="#183D32" stroke-width="3"><circle cx="85" cy="713" r="19"/><path d="M85,732 V793 M50,756 H120 M85,793 L55,838 M85,793 L115,838"/></g>
<text x="85" y="872.0" text-anchor="middle" dominant-baseline="middle" font-size="22" font-weight="bold" style="fill:#183D32">Customer</text>
<g fill="none" stroke="#183D32" stroke-width="3"><circle cx="1515" cy="713" r="19"/><path d="M1515,732 V793 M1480,756 H1550 M1515,793 L1485,838 M1515,793 L1545,838"/></g>
<text x="1515" y="872.0" text-anchor="middle" dominant-baseline="middle" font-size="22" font-weight="bold" style="fill:#183D32">Device owner</text>
<rect x="45" y="1345" width="1510" height="120" rx="8" fill="#F1F6F3" stroke="#D9E7E0" stroke-width="2"/>
<text x="70" y="1375.0" text-anchor="start" dominant-baseline="middle" font-size="18" font-weight="normal" style="fill:#183D32">Lines show participation, not sequence. Recycling is available without login; account operations require authentication.</text>
<text x="70" y="1408.0" text-anchor="start" dominant-baseline="middle" font-size="18" font-weight="normal" style="fill:#183D32">GCash is paid outside EcoRefill and verified by the owner. Buy Points is accessed through a scanned refill session.</text>
<text x="70" y="1441.0" text-anchor="start" dominant-baseline="middle" font-size="18" font-weight="normal" style="fill:#183D32">Machine readings and alerts depend on supplied data. Hardware and Firebase are inside this whole-system boundary.</text>
</svg>
