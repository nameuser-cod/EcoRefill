<text x="800" y="390.0" text-anchor="middle" dominant-baseline="middle" font-size="19" font-weight="normal" style="fill:#183D32">Manage own profile</text>
<text x="490" y="473.0" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="bold" style="fill:#64776E">CUSTOMER SERVICES</text>
<text x="1110" y="473.0" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="bold" style="fill:#64776E">OWNER SERVICES</text>
<ellipse cx="490" cy="540" rx="197.5" ry="36.0" fill="#EAF7F1" stroke="#247558" stroke-width="2"/>
